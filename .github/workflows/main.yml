name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-test:
    name: DSP-Mathe-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O2 -Wall -Wextra -I Source tests/dsp_test.cpp -o dsp_test && ./dsp_test

  windows:
    name: Windows (VST3 + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target RavenClipper_VST3 --parallel

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installer bauen
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\windows\RavenClipper.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RavenClipper-Windows
          path: dist/*.exe

  macos:
    name: macOS (VST3 + Installer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 (Universal - Apple Silicon + Intel)
        run: cmake --build build --target RavenClipper_VST3 --parallel 4

      - name: Installer (.pkg) bauen
        run: bash installer/mac/build_pkg.sh "${{ steps.ver.outputs.version }}"
        # Für signierte/notarisierte Builds hier APP_SIGN_ID / PKG_SIGN_ID als Secrets setzen (siehe README).

      - uses: actions/upload-artifact@v4
        with:
          name: RavenClipper-macOS
          path: dist/*.pkg

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dsp-test, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
